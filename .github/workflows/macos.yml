name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build unsigned Release app
        run: |
          xcodebuild -version
          xcodebuild -project Laer.xcodeproj -scheme Laer -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/Laer" \
            -onlyUsePackageVersionsFromResolvedFile COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

      - name: Run headless tests
        run: |
          xcodebuild -project Laer.xcodeproj -scheme Laer -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/Laer" \
            -onlyUsePackageVersionsFromResolvedFile -skip-testing:LaerMacUITests \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            test | xcbeautify --renderer github-actions
