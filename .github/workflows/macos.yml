name: macOS

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: LaerCore tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: swift test --package-path Packages/LaerCore

  app-tests:
    name: Laer build and UI tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Build and run UI tests
        run: |
          xcodebuild -project Laer.xcodeproj -scheme Laer \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:LaerMacUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/LaerUITests.xcresult" test
