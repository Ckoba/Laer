name: macOS

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: LaerCore tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: swift test --package-path Packages/LaerCore

  app-tests:
    name: Laer build and UI tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Build and run UI tests
        run: |
          xcodebuild -project Laer.xcodeproj -scheme Laer \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:LaerMacUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/LaerUITests.xcresult" test
      - name: Upload UI test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LaerUITests-xcresult
          path: ${{ runner.temp }}/LaerUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
